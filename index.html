<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 NFT Downloader - 2-Part ZIP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    body { background:#0a0a1a; color:#fff; min-height:100vh; padding:20px; display:flex; align-items:center; justify-content:center; }
    .container { max-width:960px; width:100%; margin:0 auto; text-align:center; }
    h1 { font-size:2.6rem; margin-bottom:8px; background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .subtitle { color:#aaa; margin-bottom:25px; font-size:1.05rem; }
    .color-preview { display:inline-block; background:#d4ff00; padding:2px 18px; border-radius:4px; color:#000; font-weight:bold; }
    .card { background:#141428; border-radius:20px; padding:35px 25px; box-shadow:0 20px 40px rgba(0,0,0,.6); border:1px solid #2a2a4a; }
    .status-box { background:#0f0f22; border-radius:12px; padding:18px; margin-bottom:22px; border:1px solid #1f1f3a; }
    .status-msg { font-size:1.1rem; color:#ccc; }
    .status-msg .highlight { color:#d4ff00; font-weight:bold; }
    .progress-container { width:100%; background:#1a1a2e; border-radius:10px; height:30px; margin:12px 0; overflow:hidden; display:none; }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#d4ff00,#a0cc00); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:.85rem; color:#000; transition:width .3s ease; }
    .btn-group { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
    .btn { padding:14px 30px; border:none; border-radius:60px; font-size:1rem; font-weight:700; cursor:pointer; transition:all .25s ease; box-shadow:0 6px 20px rgba(0,0,0,.4); min-width:170px; }
    .btn:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.6); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .btn-primary { background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); color:#000; }
    .btn-success { background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%); color:#000; }
    .btn-danger  { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    .btn-warning { background:linear-gradient(135deg,#f7971e 0%,#ffd200 100%); color:#000; }
    .btn-purple  { background:linear-gradient(135deg,#a18cd1 0%,#fbc2eb 100%); color:#000; }
    .badge { display:inline-block; background:rgba(212,255,0,.12); color:#d4ff00; padding:5px 16px; border-radius:30px; font-size:.85rem; margin:8px 0; border:1px solid rgba(212,255,0,.15); }
    .footer { margin-top:25px; color:#555; font-size:.9rem; }
    .part-box { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
    .part-card { background:#0f0f22; border-radius:12px; padding:15px 20px; border:1px solid #2a2a4a; flex:1; min-width:200px; }
    .part-card .title { color:#d4ff00; font-weight:600; font-size:.95rem; }
    .part-card .info { color:#888; font-size:.8rem; margin-top:4px; }
    .error-box { margin-top:10px; padding:10px; background:rgba(255,107,107,.1); border-radius:8px; border:1px solid rgba(255,107,107,.2); display:none; color:#ff6b6b; font-size:.9rem; }
    @media (max-width:600px) {
      h1 { font-size:1.8rem; }
      .card { padding:20px 15px; }
      .btn { padding:12px 18px; font-size:.9rem; min-width:120px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🧩 2-Part NFT Downloader</h1>
  <p class="subtitle">
    Background <span class="color-preview">#d4ff00</span> · 6,969 NFTs<br>
    <span style="color:#d4ff00;">⚡ Part 1 (1–5500) + Part 2 (5501–6969) — no crashes</span>
  </p>

  <div class="card">
    <div class="status-box">
      <div class="status-msg" id="statusMsg">
        <span class="highlight">📦 Ready</span> — download in 2 parts
      </div>
      <div class="badge" id="countBadge">0 / 6,969 NFTs</div>
      <div class="part-box">
        <div class="part-card"><div class="title">📦 Part 1</div><div class="info" id="part1Info">1 – 5,500</div></div>
        <div class="part-card"><div class="title">📦 Part 2</div><div class="info" id="part2Info">5,501 – 6,969</div></div>
      </div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div class="btn-group">
      <button id="downloadPart1Btn" class="btn btn-success">📥 Part 1 ZIP</button>
      <button id="downloadPart2Btn" class="btn btn-warning">📥 Part 2 ZIP</button>
      <button id="downloadAllBtn" class="btn btn-primary">⚡ Both Parts</button>
    </div>

    <div style="margin-top:12px;">
      <button id="cancelBtn" class="btn btn-danger" disabled style="min-width:100px; padding:8px 18px; font-size:.85rem;">⏹ Cancel</button>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div id="retryContainer" style="margin-top:8px;"></div>
  </div>
  <div class="footer">✓ Sequential naming: 1.png, 1.json … 6969.png, 6969.json · <span style="color:#888;">Auto-retry on failure</span></div>
</div>

<script>
(function() {
  // ---------- constants ----------
  const IMG_BASE  = 'https://ipfs.io/ipfs/QmTxBwjcBuhLvfrVp7bsbw6KXiTxZkPso3kpHfzw3kxGnU/';
  const META_BASE = 'https://ipfs.io/ipfs/QmdyZTZKSd4AL7sqVHU4Zpw7tQ82iQb3zefBhynufwNQRM/';
  const TOTAL = 6969;
  const PART1_END = 5500;
  const IMG_EXT = '.png';
  const BG_COLOR = '#d4ff00';
  const BATCH_SIZE = 40;
  const MAX_RETRIES = 3;

  // ---------- DOM refs ----------
  const statusMsg = document.getElementById('statusMsg');
  const countBadge = document.getElementById('countBadge');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const errorBox = document.getElementById('errorBox');
  const retryContainer = document.getElementById('retryContainer');
  const downloadPart1Btn = document.getElementById('downloadPart1Btn');
  const downloadPart2Btn = document.getElementById('downloadPart2Btn');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  let isRunning = false;
  let cancelFlag = false;
  let failedItems = [];
  let currentPart = '';

  // ---------- helpers ----------
  function setStatus(text, isGood = true) {
    statusMsg.innerHTML = text;
    statusMsg.style.color = isGood ? '#ccc' : '#ff6b6b';
  }

  function updateProgress(current, total) {
    const pct = Math.min(100, Math.round((current / total) * 100));
    progressBar.style.width = pct + '%';
    progressBar.textContent = pct + '%';
    countBadge.textContent = `${current} / ${total} NFTs`;
  }

  function setButtonsEnabled(enabled) {
    const btns = [downloadPart1Btn, downloadPart2Btn, downloadAllBtn];
    btns.forEach(b => b.disabled = !enabled);
    cancelBtn.disabled = enabled;
    if (enabled) {
      cancelBtn.textContent = '⏹ Cancel';
    } else {
      cancelBtn.textContent = '⏳ Processing...';
    }
  }

  function showError(msg) {
    errorBox.style.display = 'block';
    errorBox.innerHTML = msg;
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  // ---------- image processing ----------
  function compositeBackground(blob, color) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(nb => {
          URL.revokeObjectURL(url);
          nb ? resolve(nb) : reject(new Error('canvas failed'));
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
      img.src = url;
    });
  }

  // ---------- fetch with retry ----------
  async function fetchWithRetry(url, retries = MAX_RETRIES) {
    for (let i = 0; i < retries; i++) {
      try {
        const resp = await fetch(url, { 
          mode: 'cors',
          cache: 'force-cache',
          headers: { 'Accept': 'application/json, image/*' }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return resp;
      } catch (e) {
        if (i === retries - 1) throw e;
        await new Promise(r => setTimeout(r, 300 * (i + 1)));
      }
    }
  }

  // ---------- download part ----------
  async function downloadPart(part) {
    if (isRunning) return;
    isRunning = true;
    cancelFlag = false;
    failedItems = [];
    hideError();
    retryContainer.innerHTML = '';
    setButtonsEnabled(false);
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';

    const startNum = part === 1 ? 1 : PART1_END + 1;
    const endNum = part === 1 ? PART1_END : TOTAL;
    const total = endNum - startNum + 1;
    currentPart = `Part ${part} (${startNum}-${endNum})`;

    setStatus(`⚡ Downloading ${currentPart}...`);

    const startTime = Date.now();

    try {
      const zip = new JSZip();
      const imgFolder = zip.folder('nft_images');
      const metaFolder = zip.folder('nft_metadata');

      let processed = 0;
      let imgSuccess = 0, metaSuccess = 0;

      for (let start = startNum; start <= endNum; start += BATCH_SIZE) {
        if (cancelFlag) {
          setStatus('⏹ Cancelled.', false);
          return;
        }

        const batchEnd = Math.min(start + BATCH_SIZE - 1, endNum);
        const batch = [];
        for (let i = start; i <= batchEnd; i++) batch.push(i);

        const promises = batch.map(async (num) => {
          if (cancelFlag) return;

          try {
            const [imgResp, metaResp] = await Promise.all([
              fetchWithRetry(IMG_BASE + num + IMG_EXT),
              fetchWithRetry(META_BASE + num + '.json')
            ]);

            // Image
            try {
              const rawBlob = await imgResp.blob();
              let finalBlob;
              try {
                finalBlob = await compositeBackground(rawBlob, BG_COLOR);
              } catch (e) {
                finalBlob = rawBlob;
              }
              imgFolder.file(num + '.png', finalBlob);
              imgSuccess++;
            } catch (e) {
              failedItems.push({ num, type: 'image', error: e.message });
            }

            // Metadata
            try {
              const meta = await metaResp.json();
              metaFolder.file(num + '.json', JSON.stringify(meta, null, 2));
              metaSuccess++;
            } catch (e) {
              failedItems.push({ num, type: 'metadata', error: e.message });
            }

          } catch (e) {
            failedItems.push({ num, type: 'both', error: e.message });
          }

          processed++;
          updateProgress(processed, total);
        });

        await Promise.allSettled(promises);
      }

      if (cancelFlag) {
        setStatus('⏹ Cancelled.', false);
        return;
      }

      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      setStatus(`📦 Building ZIP (${elapsed}s) — ${imgSuccess} images, ${metaSuccess} metadata...`);

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const label = part === 1 ? 'part1_1-5500' : 'part2_5501-6969';
      const filename = `nft_${label}.zip`;
      saveAs(zipBlob, filename);

      let msg = `✅ Part ${part} complete! ${imgSuccess} images, ${metaSuccess} metadata in ${elapsed}s.`;
      if (failedItems.length > 0) {
        msg += ` ⚠️ ${failedItems.length} items failed.`;
        showError(`⚠️ ${failedItems.length} items failed. <span style="cursor:pointer;color:#d4ff00;text-decoration:underline;" id="retryFailedBtn">↻ Retry Failed</span>`);
        document.getElementById('retryFailedBtn')?.addEventListener('click', () => retryFailed(part));
      }
      setStatus(msg);
      updateProgress(total, total);
    } catch (err) {
      setStatus(`❌ Error: ${err.message}`, false);
    } finally {
      isRunning = false;
      setButtonsEnabled(true);
      if (!cancelFlag && failedItems.length === 0) {
        setTimeout(() => { progressContainer.style.display = 'none'; }, 1500);
      }
    }
  }

  // ---------- retry failed ----------
  async function retryFailed(part) {
    if (isRunning || failedItems.length === 0) return;
    isRunning = true;
    cancelFlag = false;
    hideError();
    setButtonsEnabled(false);
    setStatus(`🔄 Retrying ${failedItems.length} failed items...`);

    const toRetry = [...failedItems];
    failedItems = [];
    let retrySuccess = 0;

    const zip = new JSZip();
    const imgFolder = zip.folder('nft_images_retry');
    const metaFolder = zip.folder('nft_metadata_retry');

    const groups = {};
    toRetry.forEach(item => {
      if (!groups[item.num]) groups[item.num] = [];
      groups[item.num].push(item);
    });

    const numbers = Object.keys(groups).map(Number);
    let processed = 0;

    for (let i = 0; i < numbers.length; i += 20) {
      const batch = numbers.slice(i, i + 20);
      await Promise.all(batch.map(async (num) => {
        try {
          const [imgResp, metaResp] = await Promise.all([
            fetchWithRetry(IMG_BASE + num + IMG_EXT, 3),
            fetchWithRetry(META_BASE + num + '.json', 3)
          ]);

          const rawBlob = await imgResp.blob();
          let finalBlob;
          try {
            finalBlob = await compositeBackground(rawBlob, BG_COLOR);
          } catch (e) {
            finalBlob = rawBlob;
          }
          imgFolder.file(num + '.png', finalBlob);

          const meta = await metaResp.json();
          metaFolder.file(num + '.json', JSON.stringify(meta, null, 2));

          retrySuccess++;
        } catch (e) {
          failedItems.push({ num, type: 'both', error: e.message });
        }
        processed++;
        updateProgress(processed, numbers.length);
      }));
    }

    if (failedItems.length === 0) {
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const label = part === 1 ? 'part1_retry' : 'part2_retry';
      saveAs(zipBlob, `nft_${label}_recovered.zip`);
      setStatus(`✅ Retry complete! ${retrySuccess} items recovered.`);
      hideError();
    } else {
      setStatus(`⚠️ ${failedItems.length} items still failed.`, false);
      showError(`⚠️ ${failedItems.length} items still failed. <span style="cursor:pointer;color:#d4ff00;text-decoration:underline;" id="retryFailedBtn2">↻ Retry Again</span>`);
      document.getElementById('retryFailedBtn2')?.addEventListener('click', () => retryFailed(part));
    }

    isRunning = false;
    setButtonsEnabled(true);
    if (failedItems.length === 0) {
      setTimeout(() => { progressContainer.style.display = 'none'; }, 1500);
    }
  }

  // ---------- cancel ----------
  cancelBtn.addEventListener('click', () => {
    if (isRunning) {
      cancelFlag = true;
      setStatus('⏹ Cancelling...', false);
      cancelBtn.disabled = true;
    }
  });

  // ---------- button handlers ----------
  downloadPart1Btn.addEventListener('click', () => downloadPart(1));
  downloadPart2Btn.addEventListener('click', () => downloadPart(2));
  
  downloadAllBtn.addEventListener('click', async () => {
    if (isRunning) return;
    await downloadPart(1);
    if (!cancelFlag && failedItems.length === 0) {
      setTimeout(async () => {
        await downloadPart(2);
      }, 1000);
    }
  });

  // ---------- initial state ----------
  countBadge.textContent = `0 / ${TOTAL} NFTs`;
  setStatus(`<span class="highlight">🧩 Ready</span> — download in 2 parts (max 5,500 per part)`);
  progressContainer.style.display = 'none';
  setButtonsEnabled(true);
})();
</script>
</body>
</html>
