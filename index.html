<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT ব্যাকগ্রাউন্ড চেঞ্জার #d4ff00</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #d4ff00 0%, #a0cc00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .color-preview {
            display: inline-block;
            background: #d4ff00;
            padding: 2px 15px;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #2a2a4a;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4ff00 0%, #a0cc00 100%);
            color: #000;
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #000;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            color: #000;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .progress-container {
            width: 100%;
            background: #1a1a2e;
            border-radius: 10px;
            height: 30px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4ff00 0%, #a0cc00 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #000;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .nft-item {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .nft-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            z-index: 2;
        }
        .nft-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .nft-item .placeholder {
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
        }
        .nft-item .index-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .nft-item .retry-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 200, 0, 0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 3;
        }
        .nft-item .retry-btn:hover {
            transform: scale(1.2);
            background: #ffd700;
        }
        .nft-item.failed .retry-btn {
            display: flex;
        }
        .nft-item.failed .placeholder {
            color: #ff6b6b;
        }
        .status-msg {
            text-align: center;
            padding: 15px;
            color: #aaa;
            font-size: 1rem;
        }

        /* মোডাল */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            display: block;
        }
        .modal-close {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff6b6b;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,0,0,0.3);
        }
        .modal-close:hover {
            transform: scale(1.1);
            background: #ff0000;
        }
        .modal-index {
            text-align: center;
            color: #d4ff00;
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .btn { padding: 10px 25px; font-size: 0.9rem; }
            .modal-content { padding: 10px; }
            .modal-close { top: -10px; right: -10px; width: 32px; height: 32px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 NFT ব্যাকগ্রাউন্ড চেঞ্জার</h1>
        <p class="subtitle">
            প্রতিটি NFT এর ব্যাকগ্রাউন্ড হবে <span class="color-preview">#d4ff00</span>
            <br><small>শুধু যে লোড হয়নি সেটা রিফ্রেশ করুন | কার্ডে ক্লিক করে বড় করে দেখুন</small>
        </p>

        <div class="controls">
            <button id="loadBtn" class="btn btn-primary">📥 NFT লোড করুন</button>
            <button id="downloadBtn" class="btn btn-success" disabled>📦 জিপ ডাউনলোড</button>
            <button id="clearBtn" class="btn btn-danger">🗑️ ক্লিয়ার করুন</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">০%</div>
        </div>

        <div id="statusMsg" class="status-msg">লোড করতে "NFT লোড করুন" বাটনে ক্লিক করুন</div>

        <div class="gallery" id="gallery"></div>
    </div>

    <!-- মোডাল -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img id="modalImage" src="" alt="NFT">
            <div class="modal-index" id="modalIndex">#0</div>
        </div>
    </div>

    <script>
        (function() {
            const BASE_URL = 'https://ipfs.io/ipfs/QmTxBwjcBuhLvfrVp7bsbw6KXiTxZkPso3kpHfzw3kxGnU/';
            const TOTAL_IMAGES = 6969;
            const IMAGE_EXT = '.png';
            const BG_COLOR = '#d4ff00';

            const gallery = document.getElementById('gallery');
            const loadBtn = document.getElementById('loadBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusMsg = document.getElementById('statusMsg');

            // মোডাল এলিমেন্ট
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalIndex = document.getElementById('modalIndex');
            const modalClose = document.getElementById('modalClose');

            let imageBlobs = new Map();
            let failedIndices = new Set();
            let isLoading = false;
            let isDownloading = false;
            let isRetrying = false;

            // মোডাল ফাংশন
            function openModal(imageUrl, index) {
                modalImage.src = imageUrl;
                modalIndex.textContent = `#${index}`;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            function clearGallery() {
                gallery.innerHTML = '';
                imageBlobs.clear();
                failedIndices.clear();
                downloadBtn.disabled = true;
                statusMsg.textContent = 'গ্যালারি ক্লিয়ার করা হয়েছে। লোড করতে বাটনে ক্লিক করুন।';
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
                progressBar.textContent = '০%';
            }

            function updateProgress(current, total) {
                const percent = Math.round((current / total) * 100);
                progressBar.style.width = percent + '%';
                progressBar.textContent = percent + '%';
                statusMsg.textContent = `লোড হচ্ছে... ${current} / ${total} (${percent}%)`;
            }

            function changeNFTBackground(blob, color) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(blob);
                    
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = color;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        canvas.toBlob((newBlob) => {
                            URL.revokeObjectURL(url);
                            if (newBlob) {
                                resolve(newBlob);
                            } else {
                                reject(new Error('ক্যানভাস থেকে ব্লব তৈরি ব্যর্থ'));
                            }
                        }, 'image/png');
                    };
                    
                    img.onerror = function() {
                        URL.revokeObjectURL(url);
                        reject(new Error('ইমেজ লোড করতে ব্যর্থ'));
                    };
                    
                    img.src = url;
                });
            }

            // শুধু failed ইমেজ রিলোড করার ফাংশন
            async function retryFailedImages() {
                if (isRetrying || failedIndices.size === 0) return;
                isRetrying = true;
                statusMsg.textContent = `🔄 ${failedIndices.size} টি ব্যর্থ NFT পুনরায় লোড হচ্ছে...`;

                let retryCount = 0;
                const failedArray = Array.from(failedIndices);
                
                for (const index of failedArray) {
                    try {
                        const url = BASE_URL + index + IMAGE_EXT;
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const blob = await response.blob();
                        const newBlob = await changeNFTBackground(blob, BG_COLOR);
                        const imageUrl = URL.createObjectURL(newBlob);
                        
                        imageBlobs.set(index, newBlob);
                        failedIndices.delete(index);
                        retryCount++;
                        
                        // গ্যালারি আপডেট
                        const existingItem = gallery.querySelector(`[data-index="${index}"]`);
                        if (existingItem) {
                            const img = existingItem.querySelector('img');
                            if (img) {
                                img.src = imageUrl;
                                img.style.display = 'block';
                            }
                            const placeholder = existingItem.querySelector('.placeholder');
                            if (placeholder) placeholder.style.display = 'none';
                            existingItem.classList.remove('failed');
                            const retryBtn = existingItem.querySelector('.retry-btn');
                            if (retryBtn) retryBtn.style.display = 'none';
                        }
                        
                        statusMsg.textContent = `🔄 পুনরায় লোড হচ্ছে... ${retryCount}/${failedArray.length}`;
                    } catch (error) {
                        console.error(`NFT #${index} পুনরায় লোড করতে ব্যর্থ:`, error);
                    }
                }

                isRetrying = false;
                if (failedIndices.size === 0) {
                    statusMsg.textContent = `✅ সব NFT সফলভাবে লোড হয়েছে!`;
                    downloadBtn.disabled = false;
                } else {
                    statusMsg.textContent = `⚠️ ${failedIndices.size} টি NFT এখনও লোড হয়নি। "রিফ্রেশ" বাটনে ক্লিক করুন।`;
                }
            }

            async function loadAllImages() {
                if (isLoading) return;
                isLoading = true;
                loadBtn.disabled = true;
                downloadBtn.disabled = true;
                clearBtn.disabled = true;

                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressBar.textContent = '০%';
                clearGallery();

                let loadedCount = 0;
                const total = TOTAL_IMAGES;
                const batchSize = 15;
                let errorCount = 0;

                try {
                    const fetchPromises = [];
                    for (let i = 1; i <= total; i++) {
                        const url = BASE_URL + i + IMAGE_EXT;
                        const promise = fetch(url)
                            .then(response => {
                                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                return response.blob();
                            })
                            .then(blob => changeNFTBackground(blob, BG_COLOR))
                            .then(newBlob => {
                                const imageUrl = URL.createObjectURL(newBlob);
                                imageBlobs.set(i, newBlob);
                                return { index: i, url: imageUrl, success: true };
                            })
                            .catch(err => {
                                errorCount++;
                                failedIndices.add(i);
                                return { index: i, url: null, success: false, error: err };
                            });

                        fetchPromises.push(promise);

                        if (fetchPromises.length >= batchSize || i === total) {
                            const results = await Promise.all(fetchPromises);
                            for (const result of results) {
                                if (result.success && result.url) {
                                    addImageToGallery(result.index, result.url);
                                    loadedCount++;
                                } else {
                                    addPlaceholderToGallery(result.index);
                                }
                                updateProgress(loadedCount, total);
                            }
                            fetchPromises.length = 0;
                        }
                    }

                } catch (error) {
                    console.error('লোডিং এ রর:', error);
                    statusMsg.textContent = `লোডিং এ রর: ${error.message}`;
                } finally {
                    isLoading = false;
                    loadBtn.disabled = false;
                    clearBtn.disabled = false;
                    if (loadedCount > 0 && failedIndices.size === 0) {
                        downloadBtn.disabled = false;
                    }
                    if (failedIndices.size > 0) {
                        statusMsg.textContent = `⚠️ ${loadedCount} টি লোড হয়েছে, ${failedIndices.size} টি ব্যর্থ। "রিফ্রেশ" বাটনে ক্লিক করে শুধু ব্যর্থ গুলো পুনরায় লোড করুন।`;
                    } else {
                        statusMsg.textContent = `✅ লোড সম্পূর্ণ! ${loadedCount} টি NFT এর ব্যাকগ্রাউন্ড ${BG_COLOR} করা হয়েছে।`;
                    }
                    progressBar.style.width = '100%';
                    progressBar.textContent = '১০০%';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                    }, 2000);
                }
            }

            function addImageToGallery(index, imageUrl) {
                const div = document.createElement('div');
                div.className = 'nft-item';
                div.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = `NFT #${index}`;
                img.loading = 'lazy';
                div.appendChild(img);
                
                const badge = document.createElement('span');
                badge.className = 'index-badge';
                badge.textContent = `#${index}`;
                div.appendChild(badge);
                
                // ক্লিক ইভেন্ট - বড় করে দেখান
                div.addEventListener('click', function(e) {
                    if (e.target.closest('.retry-btn')) return;
                    const imgElement = this.querySelector('img');
                    if (imgElement && imgElement.src) {
                        openModal(imgElement.src, index);
                    }
                });
                
                gallery.appendChild(div);
            }

            function addPlaceholderToGallery(index) {
                const div = document.createElement('div');
                div.className = 'nft-item failed';
                div.dataset.index = index;
                
                const placeholder = document.createElement('div');
                placeholder.className = 'placeholder';
                placeholder.textContent = `#${index} ❌ লোড হয়নি`;
                div.appendChild(placeholder);
                
                const badge = document.createElement('span');
                badge.className = 'index-badge';
                badge.textContent = `#${index}`;
                div.appendChild(badge);
                
                // রিফ্রেশ বাটন (শুধু ব্যর্থ গুলোর জন্য)
                const retryBtn = document.createElement('button');
                retryBtn.className = 'retry-btn';
                retryBtn.textContent = '↻';
                retryBtn.title = 'শুধু এই NFT টি রিফ্রেশ করুন';
                retryBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const index = parseInt(div.dataset.index);
                    await retrySingleImage(index);
                });
                div.appendChild(retryBtn);
                
                gallery.appendChild(div);
            }

            // একক NFT রিফ্রেশ ফাংশন
            async function retrySingleImage(index) {
                if (isRetrying) return;
                isRetrying = true;
                
                const item = gallery.querySelector(`[data-index="${index}"]`);
                if (!item) return;
                
                const placeholder = item.querySelector('.placeholder');
                const retryBtn = item.querySelector('.retry-btn');
                if (placeholder) placeholder.textContent = `#${index} ↻ লোড হচ্ছে...`;
                if (retryBtn) retryBtn.style.display = 'none';
                
                try {
                    const url = BASE_URL + index + IMAGE_EXT;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const blob = await response.blob();
                    const newBlob = await changeNFTBackground(blob, BG_COLOR);
                    const imageUrl = URL.createObjectURL(newBlob);
                    
                    imageBlobs.set(index, newBlob);
                    failedIndices.delete(index);
                    
                    // গ্যালারি আপডেট
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = `NFT #${index}`;
                    img.loading = 'lazy';
                    
                    // পুরোনো কন্টেন্ট রিমুভ
                    const oldImg = item.querySelector('img');
                    if (oldImg) oldImg.remove();
                    const oldPlaceholder = item.querySelector('.placeholder');
                    if (oldPlaceholder) oldPlaceholder.remove();
                    const oldRetryBtn = item.querySelector('.retry-btn');
                    if (oldRetryBtn) oldRetryBtn.remove();
                    
                    item.appendChild(img);
                    item.classList.remove('failed');
                    
                    // ক্লিক ইভেন্ট রিঅ্যাটাচ
                    item.addEventListener('click', function(e) {
                        if (e.target.closest('.retry-btn')) return;
                        const imgElement = this.querySelector('img');
                        if (imgElement && imgElement.src) {
                            openModal(imgElement.src, index);
                        }
                    });
                    
                    statusMsg.textContent = `✅ NFT #${index} সফলভাবে রিফ্রেশ করা হয়েছে!`;
                    
                    if (failedIndices.size === 0) {
                        downloadBtn.disabled = false;
                        statusMsg.textContent = `✅ সব NFT সফলভাবে লোড হয়েছে!`;
                    }
                } catch (error) {
                    console.error(`NFT #${index} রিফ্রেশ করতে ব্যর্থ:`, error);
                    if (placeholder) placeholder.textContent = `#${index} ❌ রিফ্রেশ ব্যর্থ`;
                    if (retryBtn) retryBtn.style.display = 'flex';
                    statusMsg.textContent = `❌ NFT #${index} রিফ্রেশ করতে ব্যর্থ। আবার চেষ্টা করুন।`;
                } finally {
                    isRetrying = false;
                }
            }

            // সব failed রিফ্রেশ
            async function retryAllFailed() {
                if (failedIndices.size === 0) {
                    statusMsg.textContent = '✅ কোনো ব্যর্থ NFT নেই!';
                    return;
                }
                await retryFailedImages();
            }

            async function downloadZip() {
                if (isDownloading) return;
                if (imageBlobs.size === 0) {
                    alert('কোনো NFT লোড হয়নি! প্রথমে লোড করুন।');
                    return;
                }

                isDownloading = true;
                downloadBtn.disabled = true;
                statusMsg.textContent = 'জিপ তৈরি হচ্ছে... দয়া করে অপেক্ষা করুন।';

                try {
                    const zip = new JSZip();
                    const folder = zip.folder('nft_bg_d4ff00');

                    let addedCount = 0;
                    for (const [index, blob] of imageBlobs.entries()) {
                        const fileName = `${index}.png`;
                        folder.file(fileName, blob);
                        addedCount++;
                        if (addedCount % 100 === 0) {
                            statusMsg.textContent = `জিপে যোগ হচ্ছে... ${addedCount}/${imageBlobs.size}`;
                        }
                    }

                    statusMsg.textContent = `জিপ তৈরি হচ্ছে... (${imageBlobs.size} টি ফাইল)`;
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    saveAs(zipBlob, `nft_background_d4ff00_1_to_${TOTAL_IMAGES}.zip`);

                    statusMsg.textContent = `✅ ডাউনলোড সম্পূর্ণ! ${imageBlobs.size} টি NFT এর ব্যাকগ্রাউন্ড ${BG_COLOR} সহ জিপে সংরক্ষিত হয়েছে।`;
                } catch (error) {
                    console.error('জিপ তৈরি/ডাউনলোডে রর:', error);
                    statusMsg.textContent = `জিপ তৈরি/ডাউনলোডে রর: ${error.message}`;
                    alert('জিপ তৈরি করতে সমস্যা হয়েছে। কনসোল দেখুন।');
                } finally {
                    isDownloading = false;
                    downloadBtn.disabled = false;
                }
            }

            loadBtn.addEventListener('click', loadAllImages);
            downloadBtn.addEventListener('click', downloadZip);
            clearBtn.addEventListener('click', clearGallery);

            // রিফ্রেশ বাটন (শুধু ব্যর্থ গুলো রিফ্রেশ করবে)
            const refreshBtn = document.createElement('button');
            refreshBtn.className = 'btn btn-warning';
            refreshBtn.textContent = '🔄 শুধু ব্যর্থ গুলো রিফ্রেশ';
            refreshBtn.id = 'refreshBtn';
            refreshBtn.addEventListener('click', retryAllFailed);
            
            // কন্ট্রোলসে যোগ করো
            const controls = document.querySelector('.controls');
            controls.appendChild(refreshBtn);

            statusMsg.textContent = 'লোড করতে "NFT লোড করুন" বাটনে ক্লিক করুন। ব্যর্থ হলে "শুধু ব্যর্থ গুলো রিফ্রেশ" বাটনে ক্লিক করুন।';
        })();
    </script>
</body>
</html>
