<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Bulk Downloader #d4ff00</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    body { background:#0a0a1a; color:#fff; min-height:100vh; padding:20px; display:flex; align-items:center; justify-content:center; }
    .container { max-width:900px; width:100%; margin:0 auto; text-align:center; }
    h1 { font-size:2.8rem; margin-bottom:10px; background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .subtitle { color:#aaa; margin-bottom:30px; font-size:1.1rem; }
    .color-preview { display:inline-block; background:#d4ff00; padding:2px 18px; border-radius:4px; color:#000; font-weight:bold; }
    .card { background:#141428; border-radius:20px; padding:40px 30px; box-shadow:0 20px 40px rgba(0,0,0,.6); border:1px solid #2a2a4a; }
    .status-box { background:#0f0f22; border-radius:12px; padding:20px; margin-bottom:25px; border:1px solid #1f1f3a; }
    .status-msg { font-size:1.1rem; color:#ccc; }
    .status-msg .highlight { color:#d4ff00; font-weight:bold; }
    .progress-container { width:100%; background:#1a1a2e; border-radius:10px; height:32px; margin:16px 0; overflow:hidden; display:none; }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#d4ff00,#a0cc00); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:.9rem; color:#000; transition:width .3s ease; }
    .btn-group { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
    .btn { padding:16px 36px; border:none; border-radius:60px; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all .25s ease; box-shadow:0 6px 20px rgba(0,0,0,.4); min-width:200px; }
    .btn:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.6); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .btn-primary { background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); color:#000; }
    .btn-success { background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%); color:#000; }
    .btn-danger  { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    .btn-warning { background:linear-gradient(135deg,#f7971e 0%,#ffd200 100%); color:#000; }
    .badge { display:inline-block; background:rgba(212,255,0,.15); color:#d4ff00; padding:6px 18px; border-radius:30px; font-size:.9rem; margin:10px 0; border:1px solid rgba(212,255,0,.2); }
    .footer { margin-top:30px; color:#555; font-size:.9rem; }
    @media (max-width:600px) {
      h1 { font-size:2rem; }
      .card { padding:25px 18px; }
      .btn { padding:14px 20px; font-size:1rem; min-width:140px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ NFT Bulk Downloader</h1>
  <p class="subtitle">
    Background <span class="color-preview">#d4ff00</span> · 6,969 NFTs with metadata<br>
    <span style="color:#888;">All images and JSON metadata – serialized &amp; zipped</span>
  </p>

  <div class="card">
    <div class="status-box">
      <div class="status-msg" id="statusMsg">
        <span class="highlight">📦 Ready</span> — click download to start
      </div>
      <div class="badge" id="countBadge">0 / 6,969 NFTs</div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div class="btn-group">
      <button id="downloadAllBtn" class="btn btn-success">📥 Download All (ZIP)</button>
      <button id="downloadImagesBtn" class="btn btn-primary">🖼️ Images ZIP</button>
      <button id="downloadMetaBtn" class="btn btn-warning">📄 Metadata ZIP</button>
    </div>

    <div style="margin-top:20px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button id="cancelBtn" class="btn btn-danger" disabled style="min-width:120px; padding:10px 20px; font-size:.9rem;">⏹ Cancel</button>
    </div>
  </div>
  <div class="footer">✓ Sequential naming: 1.png, 1.json … 6969.png, 6969.json</div>
</div>

<script>
(function() {
  // ---------- constants ----------
  const IMG_BASE  = 'https://ipfs.io/ipfs/QmTxBwjcBuhLvfrVp7bsbw6KXiTxZkPso3kpHfzw3kxGnU/';
  const META_BASE = 'https://ipfs.io/ipfs/QmdyZTZKSd4AL7sqVHU4Zpw7tQ82iQb3zefBhynufwNQRM/';
  const TOTAL = 6969;
  const IMG_EXT = '.png';
  const BG_COLOR = '#d4ff00';
  const BATCH_SIZE = 30;      // parallel requests per batch

  // ---------- DOM refs ----------
  const statusMsg = document.getElementById('statusMsg');
  const countBadge = document.getElementById('countBadge');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const downloadImagesBtn = document.getElementById('downloadImagesBtn');
  const downloadMetaBtn = document.getElementById('downloadMetaBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  let isRunning = false;
  let cancelFlag = false;

  // ---------- helpers ----------
  function setStatus(text, isGood = true) {
    statusMsg.innerHTML = text;
  }

  function updateProgress(current, total) {
    const pct = Math.min(100, Math.round((current / total) * 100));
    progressBar.style.width = pct + '%';
    progressBar.textContent = pct + '%';
    countBadge.textContent = `${current} / ${total} NFTs`;
  }

  function setButtonsEnabled(enabled) {
    const btns = [downloadAllBtn, downloadImagesBtn, downloadMetaBtn];
    btns.forEach(b => b.disabled = !enabled);
    cancelBtn.disabled = enabled;
  }

  // ---------- image processing (background composite) ----------
  function compositeBackground(blob, color) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(nb => {
          URL.revokeObjectURL(url);
          nb ? resolve(nb) : reject(new Error('canvas failed'));
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
      img.src = url;
    });
  }

  // ---------- download logic ----------
  async function downloadAll(type) {
    if (isRunning) return;
    isRunning = true;
    cancelFlag = false;
    setButtonsEnabled(false);
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';
    setStatus(`⏳ Starting ${type === 'both' ? 'full' : type} download...`);

    try {
      const zip = new JSZip();
      const imgFolder = zip.folder('nft_images');
      const metaFolder = zip.folder('nft_metadata');

      let processed = 0;
      let imgSuccess = 0, metaSuccess = 0;
      const total = TOTAL;

      // Process in batches
      for (let start = 1; start <= total; start += BATCH_SIZE) {
        if (cancelFlag) {
          setStatus('⏹ Download cancelled by user.', false);
          return;
        }

        const end = Math.min(start + BATCH_SIZE - 1, total);
        const batch = [];
        for (let i = start; i <= end; i++) batch.push(i);

        // Parallel fetch for this batch
        const promises = batch.map(async (num) => {
          if (cancelFlag) return;

          const results = { num, imgOk: false, metaOk: false };

          try {
            // 1) Fetch image
            const imgResp = await fetch(IMG_BASE + num + IMG_EXT);
            if (!imgResp.ok) throw new Error('img HTTP ' + imgResp.status);
            const rawBlob = await imgResp.blob();

            // 2) Composite background
            let finalBlob;
            try {
              finalBlob = await compositeBackground(rawBlob, BG_COLOR);
            } catch (e) {
              finalBlob = rawBlob; // fallback
            }

            if (type === 'both' || type === 'images') {
              imgFolder.file(num + '.png', finalBlob);
              imgSuccess++;
            }
            results.imgOk = true;
          } catch (e) {
            // image failed – skip
          }

          try {
            // 3) Fetch metadata
            const metaResp = await fetch(META_BASE + num + '.json');
            if (!metaResp.ok) throw new Error('meta HTTP ' + metaResp.status);
            const meta = await metaResp.json();

            if (type === 'both' || type === 'metadata') {
              metaFolder.file(num + '.json', JSON.stringify(meta, null, 2));
              metaSuccess++;
            }
            results.metaOk = true;
          } catch (e) {
            // meta failed – skip
          }

          processed++;
          updateProgress(processed, total);
        });

        await Promise.allSettled(promises);
      }

      // Finalize
      if (cancelFlag) {
        setStatus('⏹ Download cancelled.', false);
        return;
      }

      setStatus(`📦 Building ZIP with ${imgSuccess} images and ${metaSuccess} metadata files…`);
      const zipBlob = await zip.generateAsync({ type: 'blob' });

      const label = type === 'both' ? 'all' : type;
      const filename = `nft_${label}_1_to_${total}.zip`;
      saveAs(zipBlob, filename);

      setStatus(`✅ Download complete! ${imgSuccess} images, ${metaSuccess} metadata files in ZIP.`);
      updateProgress(total, total);
    } catch (err) {
      setStatus(`❌ Error: ${err.message}`, false);
    } finally {
      isRunning = false;
      setButtonsEnabled(true);
      setTimeout(() => {
        if (!cancelFlag) progressContainer.style.display = 'none';
      }, 1500);
    }
  }

  // ---------- cancel ----------
  cancelBtn.addEventListener('click', () => {
    if (isRunning) {
      cancelFlag = true;
      setStatus('⏹ Cancelling... please wait.', false);
      cancelBtn.disabled = true;
    }
  });

  // ---------- button handlers ----------
  downloadAllBtn.addEventListener('click', () => downloadAll('both'));
  downloadImagesBtn.addEventListener('click', () => downloadAll('images'));
  downloadMetaBtn.addEventListener('click', () => downloadAll('metadata'));

  // ---------- initial state ----------
  countBadge.textContent = `0 / ${TOTAL} NFTs`;
  setStatus(`<span class="highlight">📦 Ready</span> — click download to start`);
  progressContainer.style.display = 'none';
  setButtonsEnabled(true);
})();
</script>
</body>
</html>
