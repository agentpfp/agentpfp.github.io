<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Ultra-Fast NFT Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    body { background:#0a0a1a; color:#fff; min-height:100vh; padding:20px; display:flex; align-items:center; justify-content:center; }
    .container { max-width:900px; width:100%; margin:0 auto; text-align:center; }
    h1 { font-size:2.8rem; margin-bottom:10px; background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .subtitle { color:#aaa; margin-bottom:30px; font-size:1.1rem; }
    .color-preview { display:inline-block; background:#d4ff00; padding:2px 18px; border-radius:4px; color:#000; font-weight:bold; }
    .card { background:#141428; border-radius:20px; padding:40px 30px; box-shadow:0 20px 40px rgba(0,0,0,.6); border:1px solid #2a2a4a; }
    .status-box { background:#0f0f22; border-radius:12px; padding:20px; margin-bottom:25px; border:1px solid #1f1f3a; }
    .status-msg { font-size:1.1rem; color:#ccc; }
    .status-msg .highlight { color:#d4ff00; font-weight:bold; }
    .status-msg .error { color:#ff6b6b; }
    .progress-container { width:100%; background:#1a1a2e; border-radius:10px; height:32px; margin:16px 0; overflow:hidden; display:none; }
    .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#d4ff00,#a0cc00); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:.9rem; color:#000; transition:width .3s ease; }
    .btn-group { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
    .btn { padding:16px 36px; border:none; border-radius:60px; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all .25s ease; box-shadow:0 6px 20px rgba(0,0,0,.4); min-width:200px; }
    .btn:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.6); }
    .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .btn-primary { background:linear-gradient(135deg,#d4ff00 0%,#a0cc00 100%); color:#000; }
    .btn-success { background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%); color:#000; }
    .btn-danger  { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    .btn-warning { background:linear-gradient(135deg,#f7971e 0%,#ffd200 100%); color:#000; }
    .badge { display:inline-block; background:rgba(212,255,0,.15); color:#d4ff00; padding:6px 18px; border-radius:30px; font-size:.9rem; margin:10px 0; border:1px solid rgba(212,255,0,.2); }
    .footer { margin-top:30px; color:#555; font-size:.9rem; }
    .retry-btn { background:rgba(255,200,0,.15); border:1px solid rgba(255,200,0,.3); color:#ffd200; padding:8px 18px; border-radius:30px; cursor:pointer; font-size:.9rem; margin-top:10px; display:inline-block; transition:all .2s; }
    .retry-btn:hover { background:rgba(255,200,0,.25); }
    @media (max-width:600px) {
      h1 { font-size:2rem; }
      .card { padding:25px 18px; }
      .btn { padding:14px 20px; font-size:1rem; min-width:140px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🚀 Ultra-Fast NFT Downloader</h1>
  <p class="subtitle">
    6,969 NFTs · Original files, no editing · <span style="color:#d4ff00;">⚡ Lightning speed</span><br>
    <span style="color:#888;">2 ZIPs — images.zip + metadata.zip – sequential naming – no crashes</span>
  </p>

  <div class="card">
    <div class="status-box">
      <div class="status-msg" id="statusMsg">
        <span class="highlight">📦 Ready</span> — click download to start
      </div>
      <div class="badge" id="countBadge">0 / 6,969 NFTs</div>
      <div id="errorDisplay" style="margin-top:8px; font-size:.9rem; color:#ff6b6b; display:none;"></div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div class="btn-group">
      <button id="downloadAllBtn" class="btn btn-success">⚡ Download All (ZIP)</button>
      <button id="downloadImagesBtn" class="btn btn-primary">🖼️ Images ZIP</button>
      <button id="downloadMetaBtn" class="btn btn-warning">📄 Metadata ZIP</button>
    </div>

    <div style="margin-top:15px;">
      <button id="cancelBtn" class="btn btn-danger" disabled style="min-width:120px; padding:10px 20px; font-size:.9rem;">⏹ Cancel</button>
    </div>
    <div id="retryContainer" style="margin-top:10px;"></div>
  </div>
  <div class="footer">✓ Sequential: 1.png, 1.json … 6969.png, 6969.json · <span style="color:#888;">Auto-retry on failure</span></div>
</div>

<script>
(function() {
  // ---------- constants ----------
  // Multiple gateways for the same CID — if one is slow/rate-limited we
  // automatically fall back to the next one instead of failing.
  const IMG_CID  = 'QmTxBwjcBuhLvfrVp7bsbw6KXiTxZkPso3kpHfzw3kxGnU';
  const META_CID = 'QmdyZTZKSd4AL7sqVHU4Zpw7tQ82iQb3zefBhynufwNQRM';
  const GATEWAYS = [
    'https://ipfs.io/ipfs/',
    'https://cloudflare-ipfs.com/ipfs/',
    'https://dweb.link/ipfs/',
    'https://gateway.pinata.cloud/ipfs/',
    'https://nftstorage.link/ipfs/'
  ];
  const TOTAL = 6969;
  const IMG_EXT = '.png';
  const CONCURRENCY = 60;      // number of items being fetched in parallel at once
  const MAX_ATTEMPTS_PER_ITEM = GATEWAYS.length * 2; // cycles through every gateway twice
  const MAX_AUTO_PASSES = 6;   // fully automatic retry passes before asking the user

  // ---------- DOM refs ----------
  const statusMsg = document.getElementById('statusMsg');
  const countBadge = document.getElementById('countBadge');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const errorDisplay = document.getElementById('errorDisplay');
  const retryContainer = document.getElementById('retryContainer');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const downloadImagesBtn = document.getElementById('downloadImagesBtn');
  const downloadMetaBtn = document.getElementById('downloadMetaBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  let isRunning = false;
  let cancelFlag = false;

  // ---------- helpers ----------
  function setStatus(text, isGood = true) {
    statusMsg.innerHTML = text;
    statusMsg.style.color = isGood ? '#ccc' : '#ff6b6b';
  }

  function updateProgress(current, total) {
    const pct = Math.min(100, Math.round((current / total) * 100));
    progressBar.style.width = pct + '%';
    progressBar.textContent = pct + '%';
    countBadge.textContent = `${current} / ${total} NFTs`;
  }

  function setButtonsEnabled(enabled) {
    const btns = [downloadAllBtn, downloadImagesBtn, downloadMetaBtn];
    btns.forEach(b => b.disabled = !enabled);
    cancelBtn.disabled = enabled;
    cancelBtn.textContent = enabled ? '⏹ Cancel' : '⏳ Processing...';
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ---------- fetch a single asset, cycling through every gateway ----------
  // Never gives up until every gateway has been tried MAX_ATTEMPTS_PER_ITEM/GATEWAYS.length times.
  async function fetchAsset(path, signalCancel) {
    let lastErr;
    for (let attempt = 0; attempt < MAX_ATTEMPTS_PER_ITEM; attempt++) {
      if (signalCancel()) throw new Error('cancelled');
      const gateway = GATEWAYS[attempt % GATEWAYS.length];
      try {
        const resp = await fetch(gateway + path, {
          mode: 'cors',
          cache: 'default',
          headers: { 'Accept': 'application/json, image/*' }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} @ ${gateway}`);
        return resp;
      } catch (e) {
        lastErr = e;
        // short backoff with jitter before trying the next gateway
        await sleep(150 + Math.random() * 250);
      }
    }
    throw lastErr || new Error('all gateways failed');
  }

  async function fetchImage(num) { return fetchAsset(IMG_CID + '/' + num + IMG_EXT, () => cancelFlag); }
  async function fetchMeta(num)  { return fetchAsset(META_CID + '/' + num + '.json', () => cancelFlag); }

  // ---------- process a single NFT number into the zip folders ----------
  async function processItem(num, imgFolder, metaFolder) {
    const jobs = [];

    if (imgFolder) {
      jobs.push((async () => {
        const resp = await fetchImage(num);
        const rawBlob = await resp.blob();
        // store the original file exactly as-is - no re-encoding, faster & lighter on memory
        imgFolder.file(num + '.png', rawBlob);
      })());
    }

    if (metaFolder) {
      jobs.push((async () => {
        const resp = await fetchMeta(num);
        const meta = await resp.json();
        metaFolder.file(num + '.json', JSON.stringify(meta, null, 2));
      })());
    }

    // both image and metadata must succeed for this item to count as done
    await Promise.all(jobs);
  }

  // ---------- worker-pool runner: keeps CONCURRENCY workers always busy ----------
  // Faster than fixed batches because a worker instantly grabs the next
  // number instead of waiting for the whole batch to finish.
  async function runPool(numbers, imgFolder, metaFolder, onProgress) {
    const queue = [...numbers];
    const failed = [];
    let done = 0;

    async function worker() {
      while (queue.length) {
        if (cancelFlag) return;
        const num = queue.shift();
        if (num === undefined) return;
        try {
          await processItem(num, imgFolder, metaFolder);
        } catch (e) {
          failed.push(num);
        }
        done++;
        onProgress(done, numbers.length);
      }
    }

    const workers = Array.from({ length: Math.min(CONCURRENCY, numbers.length) }, () => worker());
    await Promise.all(workers);
    return failed;
  }

  // ---------- main download flow with fully automatic retry passes ----------
  async function downloadAll(type) {
    if (isRunning) return;
    isRunning = true;
    cancelFlag = false;
    errorDisplay.style.display = 'none';
    retryContainer.innerHTML = '';
    setButtonsEnabled(false);
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';
    setStatus(`⚡ Starting ultra-fast ${type === 'both' ? 'full' : type} download...`);

    const startTime = Date.now();

    try {
      // Two independent zips - one for images, one for metadata.
      const imgZip  = type === 'both' || type === 'images'  ? new JSZip() : null;
      const metaZip = type === 'both' || type === 'metadata' ? new JSZip() : null;
      const imgFolder  = imgZip;   // store files at zip root
      const metaFolder = metaZip;

      let remaining = Array.from({ length: TOTAL }, (_, i) => i + 1);
      let pass = 0;

      while (remaining.length && pass < MAX_AUTO_PASSES) {
        if (cancelFlag) { setStatus('⏹ Cancelled by user.', false); return; }
        pass++;
        if (pass > 1) {
          setStatus(`🔄 Auto-retry pass ${pass}: recovering ${remaining.length} item(s)...`);
          await sleep(500 * pass); // give rate-limited gateways a short breather
        }

        const startCount = TOTAL - remaining.length;
        remaining = await runPool(remaining, imgFolder, metaFolder, (doneInPass, totalInPass) => {
          updateProgress(startCount + doneInPass, TOTAL);
        });
      }

      if (cancelFlag) { setStatus('⏹ Cancelled.', false); return; }

      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      const succeeded = TOTAL - remaining.length;
      setStatus(`📦 Building ZIP file(s) (${elapsed}s) — ${succeeded}/${TOTAL} items ready...`);

      if (imgZip) {
        const blob = await imgZip.generateAsync({ type: 'blob' });
        saveAs(blob, `nft_images_1_to_${TOTAL}.zip`);
      }
      if (metaZip) {
        const blob = await metaZip.generateAsync({ type: 'blob' });
        saveAs(blob, `nft_metadata_1_to_${TOTAL}.zip`);
      }

      if (remaining.length === 0) {
        setStatus(`✅ Complete! All ${TOTAL} items downloaded in ${elapsed}s.`);
        updateProgress(TOTAL, TOTAL);
      } else {
        setStatus(`✅ Downloaded ${succeeded}/${TOTAL} in ${elapsed}s. ⚠️ ${remaining.length} still stuck after ${MAX_AUTO_PASSES} auto-retries.`, false);
        errorDisplay.style.display = 'block';
        errorDisplay.innerHTML = `⚠️ ${remaining.length} item(s) could not be fetched from any gateway. <span class="retry-btn" id="retryFailedBtn">↻ Retry These Now</span>`;
        document.getElementById('retryFailedBtn')?.addEventListener('click', () => retryStuck(remaining, type));
      }
    } catch (err) {
      setStatus(`❌ Error: ${err.message}`, false);
    } finally {
      isRunning = false;
      setButtonsEnabled(true);
    }
  }

  // ---------- manual retry for whatever is still stuck after all auto-passes ----------
  async function retryStuck(numbers, type) {
    if (isRunning || !numbers.length) return;
    isRunning = true;
    cancelFlag = false;
    setButtonsEnabled(false);
    errorDisplay.style.display = 'none';
    setStatus(`🔄 Retrying ${numbers.length} stuck item(s)...`);

    const imgZip  = type === 'both' || type === 'images'  ? new JSZip() : null;
    const metaZip = type === 'both' || type === 'metadata' ? new JSZip() : null;

    let remaining = [...numbers];
    let pass = 0;
    while (remaining.length && pass < MAX_AUTO_PASSES) {
      pass++;
      if (pass > 1) await sleep(500 * pass);
      remaining = await runPool(remaining, imgZip, metaZip, (done, total) => updateProgress(done, total));
    }

    if (remaining.length === 0) {
      if (imgZip)  saveAs(await imgZip.generateAsync({ type: 'blob' }), `nft_images_retry_${Date.now()}.zip`);
      if (metaZip) saveAs(await metaZip.generateAsync({ type: 'blob' }), `nft_metadata_retry_${Date.now()}.zip`);
      setStatus(`✅ Retry complete! All remaining items recovered.`);
      errorDisplay.style.display = 'none';
    } else {
      setStatus(`⚠️ ${remaining.length} item(s) still failed — the gateways may be down for these.`, false);
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML = `⚠️ ${remaining.length} item(s) still failed. <span class="retry-btn" id="retryFailedBtn2">↻ Retry Again</span>`;
      document.getElementById('retryFailedBtn2')?.addEventListener('click', () => retryStuck(remaining, type));
    }

    isRunning = false;
    setButtonsEnabled(true);
  }

  // ---------- cancel ----------
  cancelBtn.addEventListener('click', () => {
    if (isRunning) {
      cancelFlag = true;
      setStatus('⏹ Cancelling...', false);
      cancelBtn.disabled = true;
    }
  });

  // ---------- button handlers ----------
  downloadAllBtn.addEventListener('click', () => downloadAll('both'));
  downloadImagesBtn.addEventListener('click', () => downloadAll('images'));
  downloadMetaBtn.addEventListener('click', () => downloadAll('metadata'));

  // ---------- initial state ----------
  countBadge.textContent = `0 / ${TOTAL} NFTs`;
  setStatus(`<span class="highlight">🚀 Ready</span> — ultra-fast parallel download`);
  progressContainer.style.display = 'none';
  setButtonsEnabled(true);
})();
</script>
</body>
</html>
